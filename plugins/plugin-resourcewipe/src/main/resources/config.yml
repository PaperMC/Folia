# Global backup system toggle and defaults
backup:
  enabled: true
  defaultRetention: 7

resourceWorlds:
  - name: resource_world
    templatePath: templates/resource_world
    wipeSchedule: "0 4 * * *"
    backup: true
    retention: 7
    preserveInventories: false
    teleportTarget: hub
announce:
  preWipeSeconds: [600,300,60,10]
  messages:
    - "Resource world will wipe in {time}. Save your stuff!"
wipe:
  strategy: template-copy
  dryRun: false
safety:
  safeWorld: hub
  teleportPlayers: true
  lockDuringWipe: true
