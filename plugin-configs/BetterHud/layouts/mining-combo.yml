mining_combo:
  texts:
    1:
      name: mining_combo_font
      pattern: "<image:[item_in_main_hand]> <bold>[mining_combo] COMBO!</bold>"
      x: 0
      y: 0
      align: right
      scale: 0.5
      conditions:
        1:
          first: mining_combo_visible
          second: true
          operation: "=="
        2:
          first: (number)mining_combo
          second: 0
          operation: ">"